<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" width="960" height="464" role="img" aria-labelledby="tg-technooptimists-three-ways-to-help-t tg-technooptimists-three-ways-to-help-d" id="tg-technooptimists-three-ways-to-help" lang="en" style="max-width:100%;height:auto">
<title id="tg-technooptimists-three-ways-to-help-t">Three ways to help Techno Optimists</title><desc id="tg-technooptimists-three-ways-to-help-d">Three ways to help Techno Optimists. Step 1, Share something worth exploring: Share a thread: a Problem, Idea, Experiment or Build. You do not need a solution. Step 2, Bring what you know: Join a thread, add research, suggest an idea or offer to test something. Step 3, Improve the site: Report a bug on GitHub or send a pull request. The code is MIT-licensed.</desc>
