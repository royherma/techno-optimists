name: CI

"on":
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Same command CONTRIBUTING.md asks contributors to run:
      # npm run typecheck && npm test. No Cloudflare account, no secrets,
      # no Python - coordinate.py only wraps build/db/deploy, not check.
      - name: make check
        run: make check
